name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev,bench]"
      - name: test
        run: python -m pytest -q
      - name: docs site is up to date
        run: |
          pip install "markdown>=3.5"
          python tools/build_docs.py --check

  web:
    name: vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viz/web/package-lock.json
      - name: install
        working-directory: viz/web
        run: npm ci
      - name: test
        working-directory: viz/web
        run: npm test
      - name: build
        working-directory: viz/web
        run: npm run build

