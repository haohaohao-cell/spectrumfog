[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrumfog"
version = "0.3.0"
description = "Partially observable spectrum-electromagnetic simulation core"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SpectrumFog" }]
keywords = ["simulation", "electronic-warfare", "partial-observability"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
# T1 之后才会用到，先不装：
bench = ["gymnasium>=1.0"]
# 只用于生成文档站（tools/build_docs.py），内核不依赖：
docs = ["markdown>=3.5"]

[project.scripts]
spectrumfog = "spectrumfog.cli:main"

# 显式列出包：内核在 src/ 下，表现层 viz/ 在仓库根（PROJECT.md §5 的目录结构）。
# 新增子包（例如 T1 的 spectrumfog.engine）时记得加到这里。
[tool.setuptools]
packages = [
    "spectrumfog",
    "spectrumfog.engine",
    "spectrumfog.model",
    "spectrumfog.physics",
    "viz",
    "viz.static",
]
package-dir = { "" = "src", "viz" = "viz", "viz.static" = "viz/static" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# src: 内核；. : 仓库根的 viz 包（测试里要 import viz.static.plot）
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["viz/web", "out", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
  "E501",   # 中文注释不好按字符数断行
  "B008",   # pydantic Field(...) 当默认值是惯用法
]

[tool.mypy]
python_version = "3.12"
# 类型检查从"最需要的地方"开始：物理公式与数据模型（想定/平台/辐射源），
# 这两块一旦类型错了，数字会静默地算错。engine/bench 里有大量 numpy 与
# pydantic 的动态用法，逐行消音只会制造噪音——等它们的接口稳定了再纳入。
files = [
  "src/spectrumfog/physics",
  "src/spectrumfog/model",
  "src/spectrumfog/units.py",
  "src/spectrumfog/metrics.py",
  "src/spectrumfog/bands.py",
  "src/spectrumfog/replay.py",
]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# 画图代码依赖 matplotlib 的重载，类型噪音大，不纳入检查
module = ["viz.*"]
ignore_errors = true

[tool.coverage.run]
source = ["spectrumfog"]
branch = false

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
